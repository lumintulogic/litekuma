[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litekuma"
version = "1.0.0"
description = "Lightweight headless uptime monitor without WebUI"
readme = "README.md"
authors = [{ name = "LiteKuma Contributors" }]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
litekuma = "litekuma.cli:main"
